name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    name: Build Windows onedir package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q app config core dify llm services ui workers

      - name: Build release executable
        shell: pwsh
        run: |
          $env:PYINSTALLER_CONSOLE = "0"
          python -m PyInstaller main.spec --clean --noconfirm

      - name: Check artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/EY-DAClient/EY-DAClient.exe")) {
            throw "dist/EY-DAClient/EY-DAClient.exe was not produced"
          }

      - name: Smoke test worker crash logging
        shell: pwsh
        run: |
          if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $logDir = Join-Path $env:LOCALAPPDATA "EY-DAClient\logs"
          Remove-Item -Recurse -Force $logDir -ErrorAction SilentlyContinue

          $scriptPath = Join-Path $env:RUNNER_TEMP "worker_fail.py"
          Set-Content -Path $scriptPath -Value "raise RuntimeError('intentional worker smoke failure')"

          & "dist/EY-DAClient/EY-DAClient.exe" --run-script $scriptPath
          if ($LASTEXITCODE -eq 0) {
            throw "Worker smoke failure unexpectedly returned success"
          }

          $appLog = Join-Path $logDir "app.log"
          $faultLog = Join-Path $logDir "faulthandler.log"
          if (-not (Test-Path $appLog)) {
            throw "Expected app log was not written: $appLog"
          }
          if (-not (Test-Path $faultLog)) {
            throw "Expected faulthandler log was not written: $faultLog"
          }

          $content = Get-Content $appLog -Raw
          if (-not $content.Contains("Worker failed while executing")) {
            throw "app.log did not include the worker failure message"
          }
          if (-not $content.Contains("intentional worker smoke failure")) {
            throw "app.log did not include the worker exception detail"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EY-DAClient-windows
          path: dist/EY-DAClient/
